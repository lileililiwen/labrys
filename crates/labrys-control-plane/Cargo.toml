[package]
name = "labrys-control-plane"
version = "0.1.0"
edition = "2021"
description = "Labrys durable control plane: PostgreSQL/SQLx persistence adapters, versioned migrations, transactional orchestration, redacted evidence writers, a recoverable reconciliation worker, and the control-plane process configuration"
license = "MIT OR Apache-2.0"

[dependencies]
labrys-core = { path = "../labrys-core" }
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "http1", "tokio", "query"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
subtle = "1"
zeroize = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls-manual-roots",
] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "chrono",
    "uuid",
    "json",
    "migrate",
] }
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "process", "fs", "net", "io-util"] }
uuid = { version = "1", features = ["serde", "v4"] }
sha2 = "0.11.0"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
rcgen = "0.13"
