[package]
name = "labrys-core"
version = "0.1.0"
edition = "2021"
description = "Labrys control-plane contracts: Application model and desired state, inspector and adoption, agent protocol and policy, runtime and sandbox, workspace and preview, capabilities and secrets, controllers and reconciliation, deployment and rollback, observability and verification, and platform surfaces"
license = "MIT OR Apache-2.0"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
uuid = { version = "1", features = ["serde", "v4"] }
chacha20poly1305 = "0.10"
rand = "0.8"
sha2 = "0.10"
zeroize = "1"

[dev-dependencies]
serde_json = "1"
serde_yaml = "0.9"
